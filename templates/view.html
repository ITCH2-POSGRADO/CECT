{% extends "base.html" %}
{% block title %}Orden {{ order_type }}{% endblock %}
{% block content %}
<div id="print-area">
    <h2>{{ order_type|capitalize }} #{{ order_id }}</h2>
    <ul class="list-group">
    {% for key, value in data.items() %}
        <li class="list-group-item"><strong>{{ key }}:</strong> {{ value }}</li>
    {% endfor %}
    </ul>
</div>
<button class="btn btn-primary mt-3" onclick="window.print()">Imprimir</button>
<a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Volver</a>
{% endblock %}
